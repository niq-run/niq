# Development swarm
workers:
  - type: hiw
    id: default hiw
    subscriptions:
      - "*"

  - type: reason
    id: niq
    instruction: "你是 niq"
    subscriptions:
      - worker.input
      - tool.completed
      - tool.failed
      - tool.rejected
      - worker.ready
      - worker.gone
      - worker.discover
      - worker.abort
      - timer.timeout
      - timer.reminder
      - tool.requested
      - decision.made
    provider: deepseek
    model: deepseek-v4-flash

  - type: timer
    id: timer

  - type: host
    id: host

  - type: workspace
    id: workspace
    root_dir: /tmp/niq-test
    subscriptions:
      - tool.requested

  - type: program
    id: program
    subscriptions:
      - tool.requested
      - worker.discover
