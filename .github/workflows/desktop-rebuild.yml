name: Desktop rebuild

# A release's desktop job can fail on one platform while everything else about
# the release is fine — that is what `fail-fast: false` is for. Re-running that
# job from the Actions tab replays the workflow *as it was at the tag*, so a fix
# to release.sh, to a runner label or to the toolchain cannot take effect there;
# v0.18.0 spent a tag discovering that, and its macOS bundle had to be built by
# hand and uploaded with `gh release upload`.
#
# This workflow is that hand-built path, made repeatable: it runs the current
# build script against an existing tag and attaches what it produces to that
# release. It never creates a release, never touches the CLI archives and never
# publishes to npm, so it cannot damage a release that is already out.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build for (e.g. v0.18.0)'
        required: true
      platform:
        description: 'Platform to build'
        required: true
        default: macos
        type: choice
        options:
          - macos
          - linux
          - windows
      ref:
        description: 'Commit to build (defaults to the tag; pass a branch when the fix is in the build script rather than the app)'
        required: false

permissions:
  contents: write

jobs:
  desktop:
    name: desktop rebuild (${{ inputs.platform }})
    runs-on: ${{ (inputs.platform == 'macos' && 'macos-latest') || (inputs.platform == 'linux' && 'ubuntu-22.04') || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/client/desktop/src-tauri

      - name: Linux build dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli

      # The tag is `v0.18.0`; the app around it is `0.18.0`.
      - name: Resolve the app version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # `shell: bash` on every platform: the script is POSIX sh, and Git Bash is
      # what the Windows runner provides.
      - name: Build the bundle
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./app/publish/desktop/release.sh ${{ inputs.platform == 'macos' && '--universal' || '' }} --version "${{ steps.version.outputs.version }}"

      - name: Attach the artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/niq-desktop_* --clobber
