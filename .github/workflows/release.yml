name: Release

# Tag push: goreleaser publishes the CLI archives and creates the GitHub
# Release; the jobs after it add the desktop app (one bundle per platform) and
# the npm packages to that same release.
#
# A platform whose bundle fails does not remove the release or the other
# artifacts — re-run the failed job from the Actions tab. `fail-fast: false` is
# what keeps the remaining platforms going.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Release notes: one archived file per release under
      # app/publish/releases, named after the tag. app/publish/releases/LATEST.md
      # holds the current release's notes; it is used as a fallback only when it
      # names the tag being released, so a stale copy can never publish the
      # previous version's notes under a new tag.
      - name: Determine release notes
        id: notes
        run: |
          args="release --clean --config app/publish/cmd/.goreleaser.yaml"
          notes="app/publish/releases/${GITHUB_REF_NAME}.md"
          current="app/publish/releases/LATEST.md"
          if [ -f "$notes" ]; then
            echo "Using $notes as the release body."
            args="$args --release-notes $notes"
          elif [ -f "$current" ] && grep -Fq -- "$GITHUB_REF_NAME" "$current"; then
            echo "Using $current as the release body (it mentions ${GITHUB_REF_NAME})."
            args="$args --release-notes $current"
          else
            echo "::warning::No release notes for ${GITHUB_REF_NAME}; letting goreleaser generate the changelog."
          fi
          echo "release_args=$args" >> "$GITHUB_OUTPUT"

      - name: Build and create GitHub Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: ${{ steps.notes.outputs.release_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The installable desktop shell: the bundled `niq` CLI plus a webview that
  # loads the gateway's own WebUI. One job per platform because each needs a
  # native toolchain, and the sidecar has to be built for that platform's
  # target triple. The build logic lives in app/publish/desktop/release.sh, so
  # CI and a local run produce identical artifacts.
  desktop:
    name: desktop (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal covers both Apple silicon and Intel in one bundle, which
          # keeps the download list short.
          - platform: macos
            os: macos-14
            args: --universal
          - platform: windows
            os: windows-latest
            args: ''
          - platform: linux
            os: ubuntu-22.04
            args: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/client/desktop/src-tauri

      # Tauri's Linux webview toolchain.
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli

      # `shell: bash` on every platform: the release script is POSIX sh, and Git
      # Bash is what the Windows runner provides.
      - name: Build the bundle
        shell: bash
        env:
          # macOS signing/notarisation. Absent secrets simply produce an ad-hoc
          # signed bundle, which is fine for a dry run but not for users.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # linuxdeploy is an AppImage itself; let it run without FUSE in CI.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./app/publish/desktop/release.sh ${{ matrix.args }} --version "${GITHUB_REF_NAME#v}"

      - name: Attach the artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/niq-desktop_* --clobber

  # The npm package: a JS shim plus one binary subpackage per platform, built
  # from the CLI archives the release already carries.
  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Fetch the CLI archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --dir dist --pattern 'niq_*' --clobber

      - name: Publish
        run: ./app/publish/npm/publish-npm.sh "${GITHUB_REF_NAME#v}" ./dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
