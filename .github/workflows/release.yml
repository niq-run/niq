name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      # Release notes: one archived file per release under
      # app/publish/release-notes, named after the tag. app/publish/RELEASE_NOTES.md
      # holds the current release's notes; it is used as a fallback only when it
      # names the tag being released, so a stale copy can never publish the
      # previous version's notes under a new tag.
      - name: Determine release notes
        id: notes
        run: |
          args="release --clean --config app/publish/.goreleaser.yaml"
          notes="app/publish/release-notes/${GITHUB_REF_NAME}.md"
          current="app/publish/RELEASE_NOTES.md"
          if [ -f "$notes" ]; then
            echo "Using $notes as the release body."
            args="$args --release-notes $notes"
          elif [ -f "$current" ] && grep -Fq -- "$GITHUB_REF_NAME" "$current"; then
            echo "Using $current as the release body (it mentions ${GITHUB_REF_NAME})."
            args="$args --release-notes $current"
          else
            echo "::warning::No release notes for ${GITHUB_REF_NAME}; letting goreleaser generate the changelog."
          fi
          echo "release_args=$args" >> "$GITHUB_OUTPUT"

      - name: Build and create GitHub Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: ${{ steps.notes.outputs.release_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser leaves cross-platform archives in dist/; turn them into
      # npm packages and publish (subpackages first, then the main package).
      - name: Publish npm packages
        run: ./app/publish/npm/publish-npm.sh "${GITHUB_REF_NAME#v}" ./dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
