[package]
name = "niq-desktop"
version = "0.1.0"
description = "A desktop shell around the niq gateway and its WebUI"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
tauri-plugin-notification = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# The shell is glue around the system webview; optimise it for size, not speed.
# LTO and one codegen unit are what buy most of it, and `strip` drops the
# symbol table (12 MB -> ~8 MB on its own).
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
